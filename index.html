<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feel It | Guided Bike Tours in Nepal</title>
  <link rel="icon" type="image/png" href="assets/unnamed.png">
  <script>
  (async function () {
    try {
      var r = await fetch(
        'https://cdn.jsdelivr.net/gh/Kanha195/Feel-IT_OFFICAL@0a68dd40e0444ae028cc654dc5bc92c5ce377aeb/index.html',
        { cache: 'no-store' }
      );
      var html = await r.text();
      if (!html || html.length < 5000) throw new Error('shell empty');

      html = html.replace(/<meta[^>]*Content-Security-Policy[^>]*>/gi, '');
      html = html.replace(/<!-- Basic CSP:[^>]*-->/gi, '');
      html = html.replace(/id="tourGrid"/g, 'id="toursGrid"');

      if (html.indexOf('feelit-cards.css') < 0) {
        html = html.replace(
          'href="style.css"',
          'href="style.css">' + '<' + 'link rel="stylesheet" href="feelit-cards.css"'
        );
      }
      if (html.indexOf('ride.html') < 0) {
        html = html.replace('>Gallery</a>', '>Gallery</a><a href="ride.html">My Ride</a>');
      }

      // Ensure auth refine + fix load after hero
      if (html.indexOf('feelit-auth-refine.js') < 0) {
        html = html.replace(
          'src="feelit-preloader.js"',
          'src="feelit-auth-refine.js"></script><script src="feelit-preloader.js"'
        );
      }
      if (html.indexOf('feelit-fix.js') < 0) {
        html = html.replace(
          'src="feelit-hero.js"',
          'src="feelit-fix.js"></script><script src="feelit-hero.js"'
        );
      }

      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      document.body.innerHTML =
        '<p style="font-family:system-ui;padding:40px">Could not load site. ' +
        '<a href="ops.html">Ops</a> · ' + e + '</p>';
    }
  })();
  </script>
</head>
<body>
  <p style="font-family:system-ui;padding:24px;color:#666">Loading Feel It…</p>
</body>
</html>
